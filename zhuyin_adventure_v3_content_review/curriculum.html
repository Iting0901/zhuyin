<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>注音探險｜完整課程內容</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="top"><div class="shell"><h1>📚 注音探險課程內容 V2.1</h1><p>37符號・48個精選音節・32項任務・六個月進程</p></div></header><main class="shell"><p><a href="index.html">← 回到遊戲首頁</a></p><section class="card"><h2>課程範圍與注意事項</h2><p>課程分八區，月份為彈性參考。音節範例不等於完整合法音節庫。標準筆順請使用 <a href="https://stroke-order.learningweb.moe.edu.tw/phonetic.jsp" target="_blank" rel="noopener">教育部注音筆順</a>。</p></section><div id="content"></div></main><script src="assets/data.js"></script><script>const D=window.ZDATA;const e=document.getElementById('content');const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));D.groups.forEach((g,i)=>{const es=D.entries.filter(x=>g.symbols.split(' ').includes(x[0]));const sy=D.syllables.filter(x=>x[3]===i+1);const ms=D.missions.filter(x=>x.g===i+1);const sec=document.createElement('section');sec.className='card';sec.innerHTML=`<h2>第${i+1}區 ${safe(g.name)}</h2><p>${safe(g.desc)}</p><h3>符號與正確例字</h3><div style="overflow:auto"><table><thead><tr><th>符號</th><th>發音提示</th><th>例字</th></tr></thead><tbody>${es.map(x=>`<tr><td>${safe(x[0])}</td><td>${safe(x[2])}</td><td>${safe(x[4])}：${safe(x[3])}</td></tr>`).join('')}</tbody></table></div><h3>本區新增音節</h3><p>${sy.map(x=>`${safe(x[1])}（${safe(x[0])}）`).join('、')}</p><h3>四種遊戲任務</h3>${ms.map(m=>`<p><b>${safe(m.kind)}｜${safe(m.title)}</b>：${safe(m.text)}</p>`).join('')}`;e.appendChild(sec)});</script></body></html>
